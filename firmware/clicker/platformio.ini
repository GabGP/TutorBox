; PlatformIO build for the TutorBox clicker (ESP32-C3 Super Mini, Arduino framework).
; Using the Arduino IDE instead? Open clicker/clicker.ino; this file is not needed.
;
;   pio run                   build
;   pio run -t upload         flash the board on USB
;   pio device monitor        serial log (115200)

[platformio]
src_dir = clicker

[env:esp32c3-supermini]
; Official PlatformIO platform: Arduino-ESP32 core 2.0.17. The sketch also builds on
; the 3.x core that the Arduino IDE installs.
platform = espressif32 @ 7.1.3
board = esp32-c3-devkitm-1
framework = arduino
; Super Mini clones boot reliably in DIO flash mode.
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.0
monitor_speed = 115200
upload_speed = 460800
