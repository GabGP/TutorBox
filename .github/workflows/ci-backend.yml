name: ci-backend

on:
  push:
    paths:
      - "backend/**"
      - "tools/**"
      - "run.py"
      - "ruff.toml"
      - "pyrightconfig.json"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tools/**"
      - "run.py"
      - "ruff.toml"
      - "pyrightconfig.json"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep ALL __pycache__ under .cache (repo policy) and share one venv.
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.cache/venv
      VIRTUAL_ENV: ${{ github.workspace }}/.cache/venv
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check
        run: |
          uv run ruff check . ../tools ../run.py
          uv run ruff format --check . ../tools ../run.py

      # Pyright is the engine behind VS Code's Pylance, so an error here is the
      # one the editor underlines. Scope and settings: ../pyrightconfig.json.
      - name: Type check
        run: uv run pyright -p ..

      - name: Test with coverage gate
        run: uv run pytest
