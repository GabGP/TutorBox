name: ci-backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep ALL __pycache__ under .cache (repo policy) and share one venv.
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.cache/venv
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test with coverage gate
        run: uv run pytest
