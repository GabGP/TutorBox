[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorbox-backend"
version = "0.1.0"
description = "TutorBox FastAPI Backend & AI Socratic Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.13.4",
    "bcrypt>=5.0.0",
    "passlib[bcrypt]>=1.7.4",
    "sympy>=1.14.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"
