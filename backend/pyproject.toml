[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorbox-backend"
version = "0.1.0"
description = "TutorBox FastAPI Backend & AI Socratic Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "bcrypt>=5.0.0",
    "sympy>=1.14.0",
    "httpx2>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80"
cache_dir = "../.cache/pytest"

[tool.pytest_env]
PYTHONPYCACHEPREFIX = "../.cache/pycache"

[tool.coverage.run]
data_file = "../.cache/.coverage"

[tool.ruff]
line-length = 88
target-version = "py310"
cache-dir = "../.cache/ruff"
src = ["src", "backend/src", "."]

[tool.ruff.lint.isort]
known-first-party = ["api", "db", "security", "src", "tests"]
