[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "tutorbox-backend"
version = "0.1.0"
description = "TutorBox FastAPI Backend & AI Socratic Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "bcrypt>=5.0.0",
    "sympy>=1.14.0",
    "httpx2>=2.13.0",
    "piper-tts>=1.8.0",
    "sherpa-onnx>=1.13.8",
    "onnx>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.1",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "cmake>=3.28.0",
    "ninja>=1.11.1",
]

[tool.uv]
package = false
link-mode = "copy"
cache-dir = "../.cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=src --cov-report=term-missing --cov-fail-under=100"
cache_dir = "../.cache/pytest"

# Fallback for `uv run pytest` when the shell hasn't exported an absolute
# PYTHONPYCACHEPREFIX yet (see root .env.example §9). Resolves to the same
# <repo>/.cache/pycache when CWD is backend/.
[tool.pytest_env]
PYTHONPYCACHEPREFIX = "../.cache/pycache"

[tool.coverage.run]
data_file = "../.cache/.coverage"

[tool.ruff]
line-length = 88
target-version = "py310"
cache-dir = "../.cache/ruff"
src = ["src", "."]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "main", "modes", "src", "tests"]
