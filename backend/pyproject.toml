[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "utztutor-backend"
version = "0.1.0"
description = "Utz'tutor FastAPI Backend & AI Socratic Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "bcrypt>=5.0.0",
    "sympy>=1.14.0",
    "httpx2>=2.16.0",
    "piper-tts>=1.8.0",
    "sherpa-onnx>=2.0.0",
    # Carries libonnxruntime for sherpa-onnx. Listed here because uv.lock records
    # sherpa-onnx with no dependencies: its linux_armv7l wheel declares none.
    "sherpa-onnx-core>=2.0.0",
    "onnx>=1.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.8.1",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.2",
    "cmake>=4.4.4",
    "ninja>=1.13.2",
]

[tool.uv]
package = false
link-mode = "copy"
cache-dir = "../.cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=src --cov-report=term-missing --cov-fail-under=100"
cache_dir = "../.cache/pytest"

# Fallback for `uv run pytest` when the shell hasn't exported an absolute
# PYTHONPYCACHEPREFIX yet (see root .env.example §9). Resolves to the same
# <repo>/.cache/pycache when CWD is backend/.
[tool.pytest_env]
PYTHONPYCACHEPREFIX = "../.cache/pycache"

[tool.coverage.run]
data_file = "../.cache/.coverage"

[tool.ruff]
line-length = 88
target-version = "py310"
cache-dir = "../.cache/ruff"
src = ["src", "."]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "main", "modes", "run", "src", "tests", "tools"]
