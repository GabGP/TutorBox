<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TutorBox</title>
<link rel="stylesheet" href="/static/tb.css">
<style>
  /* Student client (/alumno/): login -> (pin) -> wait -> play -> sent -> result -> final. Shell colour follows the mood. */
  body { background: var(--panel); min-height: 100vh; display: flex; flex-direction: column; transition: background .35s ease; }
  body[data-mood=good] { background: var(--D); color: #fff; }
  body[data-mood=bad] { background: var(--bad); color: #fff; }
  body[data-mood=final] { background: var(--navy); color: #fff; }
  header { height: 52px; flex: 0 0 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: var(--mute2); font-size: 13px; font-weight: 500; }
  body[data-mood] header { color: rgba(255,255,255,.8); }
  header i { width: 8px; height: 8px; border-radius: 50%; background: var(--D); display: inline-block; margin-right: 6px; }
  #out { color: inherit; font-size: 13px; font-weight: 600; text-decoration: underline; margin-left: 10px; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 20px 8px; max-width: 420px; width: 100%; margin: 0 auto; }
  section { flex: 1; display: flex; flex-direction: column; gap: 20px; animation: stepIn .34s cubic-bezier(.2,.85,.25,1); }
  .center { align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.4px; margin: 0; }
  p { margin: 0; font-size: 16px; color: var(--mute); line-height: 1.5; }
  body[data-mood] p { color: rgba(255,255,255,.86); }
  .logo { width: 76px; height: 76px; border-radius: 24px; background: var(--p); color: #fff; display: grid; place-items: center; font-size: 36px; font-weight: 700; }
  #s-login, #s-pin { justify-content: center; gap: 16px; }
  .bubble { width: 96px; height: 96px; border-radius: 30px; background: var(--tint2); color: var(--tint-ink); display: grid; place-items: center; font-size: 38px; font-weight: 700; animation: pulseSoft 2.2s ease-in-out infinite; }
  #s-wait h1 { font-size: 26px; }
  #s-wait p { font-size: 17px; max-width: 240px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--mute2); font-weight: 500; }
  .ring { width: 46px; height: 46px; }
  .ring > div { width: 36px; height: 36px; font-size: 17px; }
  .q { font-size: 23px; font-weight: 600; line-height: 1.25; text-wrap: pretty; }
  #s-play { gap: 14px; padding-top: 4px; }
  .tiles { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding-bottom: 8px; }
  .tile { border-radius: 24px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: opacity .25s ease, transform .18s cubic-bezier(.2,.85,.25,1); min-height: 110px; }
  .tile:active { transform: scale(.96); }
  .tile:disabled { opacity: .6; }
  .tile i { width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.26); display: grid; place-items: center; font-size: 19px; font-weight: 700; font-style: normal; }
  .tile span { font-size: 26px; font-weight: 700; }
  .pick { width: 108px; height: 108px; border-radius: 34px; color: #fff; background: var(--tint2); display: grid; place-items: center; font-size: 46px; font-weight: 700; animation: popIn .32s cubic-bezier(.2,.9,.3,1); }
  #s-sent h1 { font-size: 26px; }
  .glyph { width: 116px; height: 116px; border-radius: 36px; background: rgba(255,255,255,.22); color: #fff; display: grid; place-items: center; font-size: 54px; font-weight: 700; animation: popIn .34s cubic-bezier(.2,.9,.3,1); }
  .glyph.hit { background: var(--ok); }
  #s-result h1 { font-size: 30px; font-weight: 700; }
  #s-result p { font-size: 18px; max-width: 250px; }
  .chip { height: 44px; padding: 0 20px; border-radius: 22px; background: rgba(255,255,255,.2); font-size: 16px; font-weight: 600; display: flex; align-items: center; }
  .explain { background: rgba(255,255,255,.16); border-radius: 18px; padding: 14px 16px; font-size: 16px; line-height: 1.45; max-width: 300px; }
  .lbl { font-size: 15px; color: var(--navy-mute); letter-spacing: 1px; }
  .score { font-size: 74px; font-weight: 700; line-height: 1; }
  #s-final p { font-size: 20px; }
  #s-final h1 { font-size: 24px; max-width: 250px; }
</style>
</head>
<body>
<header><span>TutorBox</span><span><i></i><span id="who">Sin conexión</span><button id="out" hidden>Salir</button></span></header>
<main>
  <section id="s-login">
    <div class="logo">T</div>
    <div><h1>Entra al juego</h1><p style="margin-top:8px">Escribe tu usuario y tu PIN.</p></div>
    <input id="user" maxlength="32" autocomplete="username" placeholder="Tu usuario">
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" placeholder="PIN">
    <div class="err" id="lerr" hidden></div>
    <button id="enter" class="btn p">Entrar</button>
    <button id="signup" class="link">¿Primera vez? Crear cuenta</button>
  </section>

  <section id="s-pin" hidden>
    <div class="logo">T</div>
    <div><h1>Elige tu PIN nuevo</h1><p style="margin-top:8px">Tu maestro te dio un PIN temporal. Cámbialo por uno que solo tú sepas.</p></div>
    <input id="npin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN nuevo (4 a 8 números)">
    <input id="npin2" type="password" inputmode="numeric" maxlength="8" placeholder="Repite el PIN nuevo">
    <div class="err" id="perr" hidden></div>
    <button id="setpin" class="btn p">Guardar y entrar</button>
  </section>

  <section id="s-wait" class="center" hidden>
    <div class="bubble" id="initial"></div>
    <h1 id="waitTitle"></h1>
    <p>Tu maestro está preparando el juego.</p>
  </section>

  <section id="s-play" hidden>
    <div class="top"><span id="counter"></span><div class="ring" id="ring"><div></div></div></div>
    <div class="q" id="qtext"></div>
    <div class="tiles" id="tiles">
      <button class="tile k-A" data-k="A"><i>A</i><span></span></button>
      <button class="tile k-B" data-k="B"><i>B</i><span></span></button>
      <button class="tile k-C" data-k="C"><i>C</i><span></span></button>
      <button class="tile k-D" data-k="D"><i>D</i><span></span></button>
    </div>
  </section>

  <section id="s-sent" class="center" hidden>
    <div class="pick" id="pick"></div>
    <h1 id="sentTitle">Respuesta enviada</h1>
    <p id="sentBody">Espera a que todos terminen.</p>
  </section>

  <section id="s-result" class="center" hidden>
    <div class="glyph" id="glyph"></div>
    <h1 id="resultTitle"></h1>
    <p id="resultBody"></p>
    <div class="explain" id="explain" hidden></div>
    <div class="chip" id="chip"></div>
  </section>

  <section id="s-final" class="center" hidden>
    <div class="lbl">TERMINÓ EL JUEGO</div>
    <div class="score" id="finalScore"></div>
    <p id="finalOf"></p>
    <h1 id="finalName"></h1>
  </section>
</main>

<script src="/static/tb.js"></script>
<script>
let me = null, sid = localStorage.getItem('tb_last_session'), cur = null, shownAt = 0, votes = null, hits = null;
// ponytail: per-device score in localStorage; a reveal this phone never saw is not counted
const store = () => localStorage.setItem('tb_votes_' + sid, JSON.stringify({ votes, hits }));
function attach(id) {
  if (sid === id && votes) return;
  sid = id; localStorage.setItem('tb_last_session', id);
  ({ votes = {}, hits = {} } = JSON.parse(localStorage.getItem('tb_votes_' + id) || '{}'));
}
const score = () => Object.values(hits || {}).filter(Boolean).length;

function show(id, mood) {
  for (const s of ['login', 'pin', 'wait', 'play', 'sent', 'result', 'final']) $('s-' + s).hidden = s !== id;
  if (mood) document.body.dataset.mood = mood; else delete document.body.dataset.mood;
  $('out').hidden = !me;
  $('who').textContent = me ? me.username : 'Sin conexión';
}

function sent(mine) {
  $('pick').textContent = mine || '⏱';
  $('pick').className = 'pick' + (mine ? ' k-' + mine : '');
  $('sentTitle').textContent = mine ? 'Respuesta enviada' : 'Se acabó el tiempo';
  $('sentBody').textContent = mine ? 'Espera a que todos terminen.' : 'Espera el resultado de la pregunta.';
  show('sent');
}

function render(s) {
  if (!s || s.status === 'lobby' || !s.current_round || !s.current_round.question) {
    $('initial').textContent = me.username.charAt(0).toUpperCase();
    $('waitTitle').textContent = `Hola, ${me.username}`;
    return show('wait');
  }
  attach(s.id);
  const r = s.current_round, q = r.question, mine = votes[r.round_id];
  if (s.status === 'completed') {
    $('finalScore').textContent = score();
    $('finalOf').textContent = `respuestas correctas de ${s.question_count}`;
    $('finalName').textContent = `¡Buen trabajo, ${me.username}!`;
    return show('final', 'final');
  }
  if (r.status === 'revealed') {
    const correct = r.result.tally.correct_option, hit = mine === correct, answer = `${correct} · ${q.options[correct]}`;
    if (mine && !(r.round_id in hits)) { hits[r.round_id] = hit; store(); }
    $('glyph').textContent = hit ? '✓' : mine ? '✕' : '–';
    $('glyph').classList.toggle('hit', hit);
    $('resultTitle').textContent = hit ? '¡Correcto!' : mine ? 'Casi' : 'Sin respuesta';
    $('resultBody').textContent = hit ? answer : `La respuesta era ${answer}`;
    const why = mine && !hit ? r.result.explanations[mine] : '';
    $('explain').hidden = !why;
    $('explain').textContent = why || '';
    $('chip').textContent = `${score()} de ${r.round_index + 1} correctas`;
    return show('result', hit ? 'good' : 'bad');
  }
  if (mine || r.status !== 'open' || r.time_remaining === 0) return sent(mine);
  if (!cur || cur.round_id !== r.round_id) shownAt = performance.now();
  cur = r;
  $('counter').textContent = `Pregunta ${r.round_index + 1} de ${s.question_count}`;
  ring('ring', r.time_remaining, r.duration_seconds);
  $('qtext').textContent = q.question_text;
  for (const b of $('tiles').children) { b.lastElementChild.textContent = q.options[b.dataset.k]; b.disabled = false; }
  show('play');
}

for (const b of document.querySelectorAll('.tile')) b.onclick = async () => {
  if (!cur) return;
  for (const t of $('tiles').children) t.disabled = true;
  try {
    await api('POST', `/session/${sid}/vote`, { selected_option: b.dataset.k, transport_type: 'web', response_time_ms: Math.round(performance.now() - shownAt) });
    votes[cur.round_id] = b.dataset.k; store();
    sent(b.dataset.k);
  } catch (e) {
    if (e.status === 401) return toLogin(); // 409 = already voted or window closed: the next poll shows the right screen
    for (const t of $('tiles').children) t.disabled = false;
  }
};

function toLogin() { me = null; localStorage.removeItem('tb_token'); show('login'); }
function start(m) { me = m; show('wait'); }
$('out').onclick = async () => { await auth.logout(); toLogin(); };
bindLogin({ show, onDone: start, signup: true });

poll(async () => {
  if (!me) return;
  try { return render(await api('GET', sessionPath(), undefined, false)); }
  catch (e) { if (e.status !== 404) return; }
  // /current ignores completed sessions: keep following ours so the final screen shows until a new match starts
  if (!sid) return render(null);
  try { render(await api('GET', '/session/' + sid, undefined, false)); } catch { render(null); }
});
auth.me().then(m => m ? start(m) : show('login'));
</script>
</body>
</html>
