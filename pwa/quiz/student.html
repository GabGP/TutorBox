<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TutorBox</title>
<style>
  :root { --a:#e74c3c; --b:#3498db; --c:#f1c40f; --d:#2ecc71; --bg:#1a1f2e; --card:#242a3d; --fg:#f4f6fb; --mute:#9aa3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; padding:12px 16px; font-size:14px; color:var(--mute); }
  main { flex:1; display:flex; flex-direction:column; padding:16px; gap:16px; }
  [hidden] { display:none !important; }
  h1 { font-size:22px; margin:0; text-align:center; }
  .center { margin:auto; text-align:center; width:100%; max-width:420px; }
  input { width:100%; font-size:22px; padding:14px; border-radius:12px; border:0; text-align:center; margin:16px 0; }
  button { font-size:20px; padding:14px; border:0; border-radius:12px; background:#5b6cff; color:#fff; width:100%; }
  .q { font-size:24px; line-height:1.3; text-align:center; padding:8px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; flex:1; }
  .opt { border-radius:16px; font-size:20px; font-weight:600; min-height:110px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; color:#111; transition:opacity .2s, transform .1s; }
  .opt:active { transform:scale(.97); }
  .opt small { font-size:28px; }
  .opt[data-k=A]{background:var(--a)} .opt[data-k=B]{background:var(--b)} .opt[data-k=C]{background:var(--c)} .opt[data-k=D]{background:var(--d)}
  .opts.locked .opt:not(.mine) { opacity:.3; }
  .opt.correct { outline:5px solid #fff; opacity:1; }
  .opt.wrong.mine { opacity:.5; }
  .msg { text-align:center; color:var(--mute); font-size:18px; }
  .big { font-size:40px; }
  .explain { background:var(--card); border-radius:12px; padding:14px; font-size:18px; line-height:1.4; }
</style>
</head>
<body>
<header><span id="who"></span><span id="pts"></span></header>
<main>
  <section id="login" class="center">
    <h1>¡Hola! ¿Cómo te llamas?</h1>
    <input id="name" maxlength="24" autocomplete="off" placeholder="Tu nombre">
    <button id="join">Entrar</button>
  </section>

  <section id="wait" class="center" hidden>
    <div class="big">⏳</div>
    <h1>Esperando a que el maestro empiece…</h1>
  </section>

  <section id="play" hidden>
    <div class="msg" id="counter"></div>
    <div class="q" id="qtext"></div>
    <div class="opts" id="opts">
      <button class="opt" data-k="A"><small>A</small><span></span></button>
      <button class="opt" data-k="B"><small>B</small><span></span></button>
      <button class="opt" data-k="C"><small>C</small><span></span></button>
      <button class="opt" data-k="D"><small>D</small><span></span></button>
    </div>
    <div class="msg" id="status"></div>
    <div class="explain" id="explain" hidden></div>
  </section>

  <section id="done" class="center" hidden>
    <div class="big">🏁</div>
    <h1>¡Terminamos!</h1>
    <p class="msg" id="final"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let name = localStorage.getItem('tb_name') || '';

const api = (path, body) => fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, ...body }) }).then(r => r.json());

$('join').onclick = async () => {
  name = $('name').value.trim();
  if (!name) return;
  localStorage.setItem('tb_name', name);
  $('who').textContent = name;
  render(await api('/join'));
};
$('name').onkeydown = e => { if (e.key === 'Enter') $('join').click(); };

for (const b of document.querySelectorAll('.opt')) b.onclick = async () => {
  const r = await api('/vote', { choice: b.dataset.k });
  if (r.ok) render(r);
};

function show(id) { for (const s of ['login','wait','play','done']) $(s).hidden = s !== id; }

function render(s) {
  $('pts').textContent = s.score == null ? '' : `⭐ ${s.score}`;
  if (s.phase === 'lobby') return show('wait');
  if (s.phase === 'finished') { $('final').textContent = `Tu puntaje: ${s.score ?? 0} de ${s.total}`; return show('done'); }
  show('play');
  $('counter').textContent = `Pregunta ${s.index + 1} de ${s.total}`;
  $('qtext').textContent = s.question.text;
  const opts = $('opts');
  opts.classList.toggle('locked', !!s.my_choice);
  for (const b of opts.children) {
    const k = b.dataset.k;
    b.lastElementChild.textContent = s.question.options[k];
    b.classList.toggle('mine', s.my_choice === k);
    b.classList.toggle('correct', s.correct === k);
    b.classList.toggle('wrong', !!s.correct && s.my_choice === k && s.correct !== k);
    b.disabled = s.phase !== 'question';
  }
  $('explain').hidden = true;
  if (s.phase === 'question') $('status').textContent = s.my_choice ? `Elegiste ${s.my_choice}. Puedes cambiar hasta que se cierre.` : 'Elige una respuesta';
  else if (!s.my_choice) $('status').textContent = `No respondiste. La correcta era ${s.correct}.`;
  else if (s.my_choice === s.correct) $('status').textContent = '✅ ¡Correcto!';
  else { $('status').textContent = `❌ La correcta era ${s.correct}`; if (s.explanation) { $('explain').textContent = s.explanation; $('explain').hidden = false; } }
}

async function poll() {
  if (name) {
    try { render(await fetch('/state?name=' + encodeURIComponent(name)).then(r => r.json())); } catch {}
  }
  setTimeout(poll, 1000); // ponytail: 1s polling; move to SSE/WebSocket if >30 clients lag
}
if (name) { $('name').value = name; $('who').textContent = name; api('/join').then(render); }
poll();
</script>
</body>
</html>
