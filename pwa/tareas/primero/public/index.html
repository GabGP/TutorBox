<!DOCTYPE html>
<html lang="es-GT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2E7D32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Q'uq' Matemáticas" />
  <meta name="description" content="Aprende matemáticas con Q'uq' el quetzal - App para niños de Guatemala" />
  <title>Aprende Matemáticas con Q'uq'</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active">
      <svg class="loading-kuk" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Kuk the Quetzal - Programmatic SVG -->
        <!-- Tail feathers -->
        <ellipse cx="70" cy="125" rx="6" ry="22" fill="#1B5E20" transform="rotate(-15,70,125)" />
        <ellipse cx="70" cy="125" rx="6" ry="26" fill="#2E7D32" transform="rotate(0,70,125)" />
        <ellipse cx="70" cy="125" rx="6" ry="22" fill="#1B5E20" transform="rotate(15,70,125)" />
        <ellipse cx="70" cy="123" rx="4" ry="18" fill="#69F0AE" transform="rotate(-8,70,123)" />
        <ellipse cx="70" cy="123" rx="4" ry="20" fill="#69F0AE" transform="rotate(8,70,123)" />
        <!-- Body -->
        <ellipse cx="70" cy="82" rx="28" ry="34" fill="#2E7D32" />
        <!-- Red chest -->
        <ellipse cx="70" cy="90" rx="20" ry="22" fill="#C62828" />
        <ellipse cx="70" cy="95" rx="16" ry="14" fill="#EF5350" />
        <!-- Wing left -->
        <ellipse cx="44" cy="80" rx="16" ry="24" fill="#1B5E20" transform="rotate(-20,44,80)" />
        <ellipse cx="45" cy="82" rx="10" ry="18" fill="#4CAF50" transform="rotate(-20,45,82)" />
        <!-- Wing right -->
        <ellipse cx="96" cy="80" rx="16" ry="24" fill="#1B5E20" transform="rotate(20,96,80)" />
        <ellipse cx="95" cy="82" rx="10" ry="18" fill="#4CAF50" transform="rotate(20,95,82)" />
        <!-- Head -->
        <circle cx="70" cy="52" r="26" fill="#2E7D32" />
        <!-- Crest -->
        <ellipse cx="64" cy="30" rx="5" ry="12" fill="#4CAF50" transform="rotate(-20,64,30)" />
        <ellipse cx="70" cy="27" rx="5" ry="14" fill="#4CAF50" />
        <ellipse cx="76" cy="30" rx="5" ry="12" fill="#4CAF50" transform="rotate(20,76,30)" />
        <!-- Eyes -->
        <circle cx="60" cy="50" r="10" fill="white" />
        <circle cx="80" cy="50" r="10" fill="white" />
        <circle cx="62" cy="51" r="6" fill="#1A237E" />
        <circle cx="82" cy="51" r="6" fill="#1A237E" />
        <circle cx="63" cy="50" r="3" fill="black" />
        <circle cx="83" cy="50" r="3" fill="black" />
        <circle cx="64" cy="49" r="1.5" fill="white" />
        <circle cx="84" cy="49" r="1.5" fill="white" />
        <!-- Beak -->
        <path d="M 63 60 Q 70 68 77 60 L 70 65 Z" fill="#FFA000" />
      </svg>
      <div class="loading-title">¡Aprende con Q'uq'!</div>
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>

    <!-- Map Screen -->
    <div id="map-screen" class="screen" role="main" aria-label="Mapa de aventura">
    </div>

    <!-- Lesson Screen -->
    <div id="lesson-screen" class="screen" role="main" aria-label="Lección">
    </div>

    <!-- Profile Screen -->
    <div id="profile-screen" class="screen" role="main" aria-label="Perfil">
    </div>

    <!-- Parent Screen -->
    <div id="parent-screen" class="screen" role="main" aria-label="Panel de padres">
    </div>

  </div>

  <!-- Main app entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
