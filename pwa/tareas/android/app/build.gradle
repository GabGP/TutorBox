plugins {
    id 'com.android.application'
}

// Release signing comes from keystore.properties (never committed, see README). Without it the
// APK is signed with this machine's debug key: fine for testing, but phones refuse an update
// signed with a different key, so create the release key before handing the app to families.
def keystoreProps = rootProject.file('keystore.properties')

android {
    namespace 'org.tutorbox.primero'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        // 2: one APK per grade; Primero's launcher label became "Q'uq' 1º".
        versionCode 2
        versionName '1.1'
    }

    // One APK per grade, from the same wrapper: each packs its own web app and has its own id, so a
    // family can install Primero, Segundo and Tercero side by side. Primero keeps the id it shipped
    // with, so copies already installed update in place. Labels: src/<grade>/res/values/strings.xml.
    flavorDimensions 'grade'
    productFlavors {
        primero {
            dimension 'grade'
            applicationId 'org.tutorbox.primero'
        }
        segundo {
            dimension 'grade'
            applicationId 'org.tutorbox.segundo'
        }
        tercero {
            dimension 'grade'
            applicationId 'org.tutorbox.tercero'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        // Each APK packs its grade's web app as-is: no copy, no second source of truth.
        primero.assets.srcDirs = ['../../primero/public']
        segundo.assets.srcDirs = ['../../segundo/public']
        tercero.assets.srcDirs = ['../../tercero/public']
    }

    androidResources {
        // Android's default ignore list, plus the crash dumps Git Bash on Windows can leave in any
        // folder it ran in: they must never ship inside the children's app.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.stackdump'
    }

    signingConfigs {
        release {
            if (keystoreProps.exists()) {
                def p = new Properties()
                keystoreProps.withInputStream { p.load(it) }
                storeFile rootProject.file(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// `gradlew publishApk`: build the three release APKs and put them where the Jetson serves
// /descargas/ (primero.apk, segundo.apk, tercero.apk).
tasks.register('publishApk', Copy) {
    dependsOn 'assembleRelease'
    ['primero', 'segundo', 'tercero'].each { grade ->
        from(layout.buildDirectory.dir("outputs/apk/${grade}/release")) {
            include '*.apk'
            rename { "${grade}.apk" }
        }
    }
    into rootProject.file('../descargas')
}
