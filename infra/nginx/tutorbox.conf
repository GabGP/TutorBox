# Utz'tutor — nginx on :80 in front of the FastAPI backend (uvicorn :8000).
#
# Phones send captive-portal probes to plain HTTP port 80, so the appliance must answer
# there. nginx is a transparent proxy: the probe answers and the walled-garden rule live in
# the backend (backend/src/api/captive.py), which needs the ORIGINAL Host header.
#
# Install (needs internet once — do it before the Jetson goes into the offline classroom):
#   sudo apt install nginx-light
#   sudo cp infra/nginx/tutorbox.conf /etc/nginx/sites-available/tutorbox
#   sudo ln -sf /etc/nginx/sites-available/tutorbox /etc/nginx/sites-enabled/tutorbox
#   sudo rm -f /etc/nginx/sites-enabled/default      # also claims default_server on :80
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
#
# See infra/captive-portal.md for the end-to-end flow and verification.

# PIN guesses and account floods, per client address: a burst of 10, then 10 a minute.
# (This file is included inside nginx's http {} block, where the zone must be defined.)
limit_req_zone $binary_remote_addr zone=tutorbox_auth:1m rate=10r/m;

# Game event batches (docs/api/games.md §8), per client address: a burst of 20, then 30 a minute.
# Why: no login is needed and every batch takes SQLite's one write lock, which quiz votes
# also need. A game stuck in a retry loop must not starve a live round; a real phone posts
# once or twice per lesson.
# Client queue (pwa/tareas/): treat 429 like any non-200. Keep the queue and send on the
# next trigger, never in a loop (§6).
# Load tests: the limit is per address. Post to uvicorn on :8000 to measure the backend alone.
limit_req_zone $binary_remote_addr zone=tutorbox_games:1m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # The router resolves every name to this box, so every Host must land here.
    server_name _;

    # Proxy settings shared by the locations below.
    proxy_http_version 1.1;
    # Backend decides "appliance vs hijacked name" from this header.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The backend writes its own Location headers (absolute captive URL, /alumno/).
    proxy_redirect off;
    # Quiz generation and TTS can take a while on the Jetson.
    proxy_read_timeout 120s;

    location ~ ^/api/v1/(auth/login|users/signup)$ {
        limit_req zone=tutorbox_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    # Exact match: the staff summary under /api/v1/games/events/ is not limited.
    location = /api/v1/games/events {
        limit_req zone=tutorbox_games burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
