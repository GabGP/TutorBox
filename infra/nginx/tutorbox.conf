# TutorBox — nginx on :80 in front of the FastAPI backend (uvicorn :8000).
#
# Phones send captive-portal probes to plain HTTP port 80, so the appliance must answer
# there. nginx is a transparent proxy: the probe answers and the walled-garden rule live in
# the backend (backend/src/api/captive.py), which needs the ORIGINAL Host header.
#
# Install (needs internet once — do it before the Jetson goes into the offline classroom):
#   sudo apt install nginx-light
#   sudo cp infra/nginx/tutorbox.conf /etc/nginx/sites-available/tutorbox
#   sudo ln -sf /etc/nginx/sites-available/tutorbox /etc/nginx/sites-enabled/tutorbox
#   sudo rm -f /etc/nginx/sites-enabled/default      # also claims default_server on :80
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
#
# See infra/captive-portal.md for the end-to-end flow and verification.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # The router resolves every name to this box, so every Host must land here.
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Backend decides "appliance vs hijacked name" from this header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend writes its own Location headers (absolute captive URL, /alumno/).
        proxy_redirect off;
        # Quiz generation and TTS can take a while on the Jetson.
        proxy_read_timeout 120s;
    }
}
