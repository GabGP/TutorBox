# OS packages. run.py only checks for these; installing them needs root, so it is done here.
- name: List the installed packages
  ansible.builtin.package_facts:
  tags: [cuda]

# Touches the network only when something is missing, so a finished kit can be run offline.
- name: Install the OS packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true
  become: true
  when: apt_packages | difference(ansible_facts.packages.keys()) | length > 0
