# Ollama serves the quiz and tutor models on 127.0.0.1:11434 (SLM_BASE_URL in .env).
# Its installer creates the ollama user and /etc/systemd/system/ollama.service.
- name: Read the Ollama version
  ansible.builtin.command: ollama --version
  register: ollama_found
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install Ollama {{ ollama_version }}
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION={{ ollama_version }} sh
  args:
    executable: /bin/bash
  become: true
  when: ollama_found.rc != 0 or ollama_version not in ollama_found.stdout

- name: Start Ollama now and at every boot
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started
  become: true
  # A check run on a blank Jetson has not installed Ollama.
  ignore_errors: "{{ ansible_check_mode }}"

- name: List the models already pulled
  ansible.builtin.command: ollama list
  register: ollama_list
  changed_when: false
  check_mode: false
  failed_when: false
  # The server needs a moment after its first start.
  retries: "{{ 0 if ansible_check_mode else 5 }}"
  delay: 3
  until: ollama_list.rc == 0 or ansible_check_mode

- name: Pull the models
  ansible.builtin.command: ollama pull {{ item }}
  loop: "{{ ollama_models | unique }}"
  when: item not in ollama_list.stdout
