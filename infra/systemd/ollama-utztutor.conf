# Drop-in for ollama.service, installed by infra/ansible/tasks/ollama.yml.
#
# Models stay in memory until the backend unloads them (backend/src/core/llm/residency): the
# tutor model while the class is in tutor mode, the quiz model during a question batch. Ollama's
# OpenAI endpoint ignores keep_alive, so the server default (5 minutes) would drop the tutor
# model in a quiet tutor session. -1 keeps models loaded until told otherwise; 2 lets the quiz
# and tutor models be loaded together.
[Service]
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
